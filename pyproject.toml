[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lark2wechat"
version = "0.1.0"
description = "飞书文档 → 微信公众号草稿箱一键发布工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "chao" }]
keywords = ["feishu", "lark", "wechat", "mp", "publisher", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pygments>=2.15",
]

[project.optional-dependencies]
math = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
lark2wechat = "lark2wechat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lark2wechat = ["themes/*.yaml", "themes/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
